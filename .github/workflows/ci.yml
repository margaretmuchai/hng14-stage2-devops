name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: localhost:5000
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Python linting tools
        run: |
          pip install flake8

      - name: Install Node.js linting tools
        run: |
          npm install --prefix frontend

      - name: Lint Python (flake8)
        run: |
          flake8 api/ worker/ --max-line-length=120 --ignore=E501,W503,E402,W292

      - name: Lint JavaScript (eslint)
        run: |
          npm run lint --prefix frontend || echo "No lint script, skipping"

- name: Lint Dockerfiles
        run: |
          set +e
          if command -v hadolint &> /dev/null; then
            hadolint api/Dockerfile
            hadolint worker/Dockerfile
            hadolint frontend/Dockerfile
          else
            echo "hadolint not found, skipping"
          fi
          set -e