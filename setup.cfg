[flake8]
max-line-length = 120
exclude = .git,__pycache__,build,dist
ignore = E501,W503,E402,W292
per-file-ignores =
    __init__.py:F401
    conftest.py:F401
    test_main.py:W292

[tool:pytest]
testpaths = api
python_files = test_*.py
python_classes = Test*
python_functions = test_*

[coverage:run]
source = .
omit =
    */tests/*
    */test_*.py
    */conftest.py
    */__pycache__/*